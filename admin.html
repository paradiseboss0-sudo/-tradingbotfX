<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - TRADINGBOTFS</title>
<style>body{background:#0b0f26;color:#fff;font-family:Arial;padding:14px}.card{background:#151a3a;padding:12px;margin:8px 0;border-radius:6px} input{padding:6px;background:#0b0f26;border:1px solid #333;color:#fff;border-radius:4px;width:70px} button{padding:6px 10px;border:none;border-radius:4px;cursor:pointer;margin-left:4px}.green{background:#00a651;color:#fff}.red{background:#c0392b;color:#fff}.login-box{background:#fff;color:#000;max-width:400px;margin:50px auto;padding:20px;border-radius:8px}.login-box input{width:100%;padding:12px;margin:8px 0;background:#fff;color:#000;border:none;border-bottom:1px solid #ddd}.login-btn{width:100%;padding:12px;background:#0a0f2a;color:#fff;border-radius:6px}</style>
</head><body>
<div id="loginBox" class="login-box"><h2 style="text-align:center">ADMIN LOGIN</h2><p style="font-size:12px;text-align:center">Only admin can access</p><input id="aEmail" placeholder="Admin Email"><input id="aPass" type="password" placeholder="Password"><button class="login-btn" onclick="adminLogin()">Login as Admin</button><p style="font-size:11px;margin-top:10px;color:#666">Email: Davidjohn70010@gmail.com<br>Pass: Admin@12345</p></div>
<div id="adminPanel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="color:#f5d06a">↗ ADMIN PANEL</h2><button class="red" onclick="adminLogout()">Logout</button></div><p>Total Clients: <b id="totalUsers">0</b> | <a href="index.html" style="color:#f5d06a">Go to Client Site</a></p><div id="usersList"></div><button class="red" style="width:100%;margin-top:20px;padding:12px" onclick="clearAll()">Clear All Clients</button></div>
<script>
function adminLogin(){
let e=document.getElementById('aEmail').value.trim().toLowerCase();
let p=document.getElementById('aPass').value.trim();
if(e=='davidjohn70010@gmail.com' && (p.toLowerCase()=='admin@12345' || p=='Admin@12345')){
localStorage.setItem('adminLogged','yes');
document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.display='block';
loadAdmin();
}else{alert('Invalid admin login - Use Davidjohn70010@gmail.com / Admin@12345')}
}
function adminLogout(){localStorage.removeItem('adminLogged');location.reload();}
function loadAdmin(){
let users=JSON.parse(localStorage.getItem('users')||'[]');
document.getElementById('totalUsers').innerText=users.length;
let list=document.getElementById('usersList');list.innerHTML='';
if(users.length==0){list.innerHTML='<p style="background:#151a3a;padding:14px;border-radius:6px">No clients yet - Clients will appear here after they register on main site</p>';return}
users.forEach((u,i)=>{
let div=document.createElement('div');div.className='card';
div.innerHTML=`<b>${u.full}</b> <span style="font-size:11px;opacity:0.7">Joined: ${u.joined?u.joined.slice(0,10):'N/A'}</span><br><span style="font-size:12px">${u.email} | ${u.mobile||''} | ${u.country||''} | ${u.currency||''}</span><br><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">Balance: <input id="b${i}" value="${u.balance||0}"> Capital: <input id="ca${i}" value="${u.capital||0}"> Profit: <input id="p${i}" value="${u.profit||0}"> Package: <select id="pkg${i}" style="width:100px"><option ${u.package=='ordinary'?'selected':''}>ordinary</option><option ${u.package=='starter'?'selected':''}>starter</option><option ${u.package=='standard'?'selected':''}>standard</option><option ${u.package=='premium'?'selected':''}>premium</option></select> <button class="green" onclick="saveUser(${i})">Save</button> <button class="red" onclick="deleteUser(${i})">Delete</button></div>`;
list.appendChild(div);
});
}
function saveUser(i){let users=JSON.parse(localStorage.getItem('users')||'[]');users[i].balance=parseFloat(document.getElementById('b'+i).value)||0;users[i].capital=parseFloat(document.getElementById('ca'+i).value)||0;users[i].profit=parseFloat(document.getElementById('p'+i).value)||0;users[i].package=document.getElementById('pkg'+i).value;localStorage.setItem('users',JSON.stringify(users));alert('Saved! Client will see: Balance $'+users[i].balance+' Capital $'+users[i].capital+' Profit $'+users[i].profit);}
function deleteUser(i){if(confirm('Delete this client?')){let users=JSON.parse(localStorage.getItem('users')||'[]');users.splice(i,1);localStorage.setItem('users',JSON.stringify(users));loadAdmin();}}
function clearAll(){if(confirm('Clear ALL clients?')){localStorage.removeItem('users');loadAdmin();}}
(function(){if(localStorage.getItem('adminLogged')=='yes'){document.getElementById('loginBox').style.display='none';document.getElementById('adminPanel').style.display='block';loadAdmin();}})();
</script></body></html>
