<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - TradingBotFX</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0e27;color:#fff;padding:12px}h1{color:#00ff88;margin:15px 0}.card{background:#151a3a;border:1px solid #1e2a5a;border-radius:12px;padding:10px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th{color:#00ff88;text-align:left;padding:8px;font-size:11px;border-bottom:2px solid #1e2a5a}td{padding:8px;font-size:11px;border-bottom:1px solid #1e2a5a}input{width:80px;background:#0a0e27;border:1px solid #2a3a6a;color:#fff;padding:5px;border-radius:5px}.btn{background:#00ff88;color:#000;border:none;padding:5px 10px;border-radius:5px;font-weight:700;cursor:pointer;margin:1px}.btn2{background:#00c3ff;color:#fff}.btn3{background:#ff3a2a;color:#fff}.badge{background:#00ff88;color:#000;padding:3px 10px;border-radius:12px}.live{border:1px solid #00ff88;border-radius:6px;padding:5px;max-height:100px;overflow:auto;background:#0a0e27;margin-top:4px}</style></head><body>
<h1>Admin Dashboard <span id="count" class="badge">0</span></h1><p style="color:#a0a8c0;font-size:12px;margin-bottom:12px">Firebase Live - Edit Capital, Profit, Package, Approve Deposit, Reply LiveChat - Works Chrome/Safari/Telegram</p>
<div class="card"><table><thead><tr><th>Name</th><th>Email/Phone</th><th>Plan</th><th>Capital</th><th>Profit</th><th>Package</th><th>Deposit</th><th>LiveChat</th><th>Save</th></tr></thead><tbody id="tbody"><tr><td colspan="9">Loading...</td></tr></tbody></table></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getFirestore,collection,onSnapshot,doc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC5JpZIYKGySCzqV-5h6vM7Xz0X9X0X0X0",authDomain:"tradingbotfx-tdfs.firebaseapp.com",projectId:"tradingbotfx-tdfs",storageBucket:"tradingbotfx-tdfs.appspot.com",messagingSenderId:"123456789",appId:"1:123:web:abc123"};
// 👆 REPLACE THIS WITH YOUR REAL FIREBASE CONFIG IF THIS DEMO CONFIG NO WORK
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const tbody=document.getElementById("tbody");const count=document.getElementById("count");
const q=query(collection(db,"users"),orderBy("createdAt","desc"));
onSnapshot(q,(snap)=>{count.textContent=snap.size;if(snap.empty){tbody.innerHTML="<tr><td colspan=9>No clients</td></tr>";return}let h="";snap.forEach(d=>{const u=d.data(),id=d.id;h+=`<tr><td><b>${u.fullName||u.name||""}</b></td><td>${u.email||""}<br><small style=color:#aaa>${u.phone||u.mobile||""}</small></td><td>${u.plan||"Starter"} $${u.planAmount||100}</td><td><input id="c-${id}" value="${u.capital||0}"></td><td><input id="p-${id}" value="${u.profit||0}"></td><td><input id="k-${id}" value="${u.package||"ordinary"}" style="width:70px"></td><td><span style="color:${u.depositStatus=="approved"?"#0f8":"#fa0"}">${u.depositStatus||"pending"}</span>${u.lastDeposit?`<br>$${u.lastDeposit}`:""}<br><button class="btn btn2" onclick="ap('${id}')">Approve</button></td><td><div class="live">${(u.messages||[]).map(m=>`<div><b>${m.from}:</b> ${m.text}</div>`).join("")||"No chat"}</div><input id="r-${id}" placeholder="Reply" style="width:90px;margin-top:3px"><button class="btn" onclick="rp('${id}')">Send</button></td><td><button class="btn" onclick="sv('${id}')">SAVE 💾</button></td></tr>`});tbody.innerHTML=h});
window.sv=async(id)=>{const cap=document.getElementById("c-"+id).value,prof=document.getElementById("p-"+id).value,pkg=document.getElementById("k-"+id).value;await updateDoc(doc(db,"users",id),{capital:parseFloat(cap),profit:parseFloat(prof),package:pkg});alert("SAVED! Client will see Capital $"+cap+" Profit $"+prof+" instantly on all browsers!");};
window.ap=async(id)=>{await updateDoc(doc(db,"users",id),{depositStatus:"approved"});alert("Deposit Approved!");};
window.rp=(id)=>{const t=document.getElementById("r-"+id).value;alert("You replied: "+t+" (Add chat save logic if you want permanent)");};
</script></body></html>
