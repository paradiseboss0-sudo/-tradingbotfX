<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - TradingBotFX</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD19gZda8g45mDo3jRDD_ro80xHjS3vIAU",
  authDomain: "tradingbotfx-8646f.firebaseapp.com",
  projectId: "tradingbotfx-8646f",
  storageBucket: "tradingbotfx-8646f.firebasestorage.app",
  messagingSenderId: "978322458067",
  appId: "1:978322458067:web:9a90a1b168aa5fa7f49b26",
  measurementId: "G-R607VCHEP2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function loadClients(){
  const tbody = document.getElementById('clientList');
  const q = query(collection(db, "clients"), orderBy("createdAt","desc"));
  onSnapshot(q, (snap)=>{
    document.getElementById('count').textContent = snap.size;
    if(snap.empty){
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#8899aa">No clients yet. Share your Telegram link.</td></tr>';
      return;
    }
    let html = '';
    snap.forEach(d=>{
      const c = d.data();
      const date = c.createdAt ? new Date(c.createdAt.seconds*1000).toLocaleString() : 'Just now';
      html += `<tr>
        <td>${c.name || ''}</td>
        <td>${c.email || ''}<br><small style="color:#8899aa">${c.phone || ''}</small></td>
        <td>${c.plan || ''}</td>
        <td>${date}</td>
        <td><button onclick="del('${d.id}')" style="background:#ff4444;padding:6px 10px;font-size:12px;border:none;border-radius:6px;color:#fff">Delete</button></td>
      </tr>`;
    });
    tbody.innerHTML = html;
  });
}

window.del = async function(id){
  if(confirm('Delete this client?')){ await deleteDoc(doc(db,"clients",id)); }
}

window.addEventListener('DOMContentLoaded', loadClients);
</script>
<style>
body{font-family:Arial,sans-serif;background:#0a0e1a;color:#fff;margin:0;padding:20px}
.container{max-width:900px;margin:20px auto;background:#141a2a;padding:20px;border-radius:12px;border:1px solid #1e2a44}
h1{color:#00d084}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:12px 8px;border-bottom:1px solid #1e2a44;text-align:left;font-size:14px}
th{color:#8899aa}
.badge{background:#00d084;color:#000;padding:4px 10px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>Admin Dashboard <span class="badge" id="count">0</span></h1>
<p style="color:#8899aa">Live clients from Firebase - Works on Chrome, Safari, Telegram browser</p>
<table>
<thead><tr><th>Name</th><th>Contact</th><th>Plan</th><th>Date</th><th>Action</th></tr></thead>
<tbody id="clientList"><tr><td colspan="5" style="text-align:center;padding:20px">Loading...</td></tr></tbody>
</table>
</div>
</body>
</html>
