<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADINGBOTFX PRO ADMIN</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#060a14;color:#fff;font-family:'Segoe UI',Arial;padding:12px}h1{text-align:center;background:linear-gradient(90deg,#00ff88,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px;margin:8px}.glass{background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px;margin:12px 0}.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}.ok{background:#00ff88;color:#000}.info{background:#38bdf8;color:#000}input,select{width:100%;padding:12px;border-radius:10px;background:#0f172a;border:1px solid #334155;color:#fff;margin:6px 0}button{padding:11px 16px;border-radius:10px;border:none;font-weight:800;cursor:pointer}.g{background:linear-gradient(90deg,#00ff88,#00ff88cc);color:#000}.b{background:linear-gradient(90deg,#38bdf8,#818cf8);color:#000}.r{background:linear-gradient(90deg,#f43f5e,#ec4899);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tab-bar{display:flex;gap:8px;justify-content:center;margin:10px 0}.tab{padding:12px 22px;border-radius:30px;background:#0f172a;border:1px solid #334155;color:#fff;font-weight:800}.tab.active{background:linear-gradient(90deg,#00ff88,#38bdf8);color:#000}
</style></head><body>
<h1>💠 TRADINGBOTFX PRO ADMIN</h1>
<div class="tab-bar">
<button class="tab active" id="tabClients" onclick="switchTab('clients')">👥 Clients</button>
<button class="tab" id="tabChats" onclick="switchTab('chats')">💬 Live Chats</button>
</div>
<div id="clientsView">
<div class="glass" style="text-align:center">Live Clients: <b id="cnt">0</b> | <span id="st" class="badge info">Connecting...</span><br><br><button class="b" onclick="loadPro()">🔄 Refresh</button></div>
<div id="list"></div>
</div>
<div id="chatsView" style="display:none">
<div class="glass" style="text-align:center">All Chats <span id="chatSt" class="badge info">Live</span><br><br><button class="b" onclick="loadAllChats()">🔄 Refresh Chats</button></div>
<div id="allChatsList"></div>
</div>
<script>
const cfg={apiKey:"AIzaSyD19gZda8g45mDo3jRDD_ro80xHjS3vIAU",authDomain:"tradingbotfx-8646f.firebaseapp.com",projectId:"tradingbotfx-8646f",storageBucket:"tradingbotfx-8646f.firebasestorage.app",messagingSenderId:"978322458067",appId:"1:978322458067:web:9a90a1b168aa5fa7f49b26"};firebase.initializeApp(cfg);const db=firebase.firestore();
function switchTab(t){document.getElementById('clientsView').style.display=t=='clients'?'block':'none';document.getElementById('chatsView').style.display=t=='chats'?'block':'none';document.getElementById('tabClients').className=t=='clients'?'tab active':'tab';document.getElementById('tabChats').className=t=='chats'?'tab active':'tab';if(t=='chats')loadAllChats();}
async function loadPro(){let all=[];let html='';document.getElementById('st').innerText='Scanning...';for(let col of ['clients','users']){try{let s=await db.collection(col).get();s.forEach(d=>all.push({id:d.id,col:col,data:d.data()}));}catch(e){}}document.getElementById('cnt').innerText=all.length;all.sort((a,b)=>(b.data.createdAt?.seconds||0)-(a.data.createdAt?.seconds||0));all.forEach(o=>{let d=o.data;let cap=d.capital??d.balance??0;let prof=d.profit??0;html+=`<div class="glass"><b>${d.email||o.id}</b><br><small>${d.name||''} | ${o.id.slice(0,10)}</small><div class="grid" style="margin-top:10px"><div>Capital $<input id="cap_${o.id}" value="${cap}"></div><div>Profit $<input id="prof_${o.id}" value="${prof}"></div></div><div class="grid"><div>Package<select id="pkg_${o.id}"><option>${d.package||'ordinary'}</option><option>ordinary</option><option>Starter $100</option><option>Silver $500</option><option>Gold $1000</option><option>Platinum $5000</option></select></div><div>Status<select id="sta_${o.id}"><option>${d.status||'active'}</option><option>active</option><option>pending</option><option>blocked</option></select></div></div><div style="display:flex;gap:8px;margin-top:10px"><button class="g" onclick="savePro('${o.col}','${o.id}')">💾 Save</button><button class="b" onclick="approvePro('${o.col}','${o.id}')">✅ Approve</button><button class="r" onclick="chatPro('${o.col}','${o.id}')">💬 Chat</button></div><div id="chat_${o.id}" style="margin-top:10px"></div></div>`;});document.getElementById('list').innerHTML=html;document.getElementById('st').innerText='✅ LIVE - '+all.length;}
function savePro(col,id){let cap=parseFloat(document.getElementById('cap_'+id).value)||0;let prof=parseFloat(document.getElementById('prof_'+id).value)||0;let pkg=document.getElementById('pkg_'+id).value;let sta=document.getElementById('sta_'+id).value;db.collection(col).doc(id).update({capital:cap,balance:cap,profit:prof,package:pkg,status:sta,lastUpdated:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{alert('Saved');});}
function approvePro(col,id){db.collection(col).doc(id).update({status:'active',approved:true}).then(()=>alert('Approved '+id));}
async function chatPro(col,id){let box=document.getElementById('chat_'+id);box.innerHTML=`<div class=glass style="border:1px solid #00ff88"><div id="msgs_${id}" style="max-height:250px;overflow-y:auto;background:#060a14;padding:8px;border-radius:10px">Loading...</div><div style="display:flex;gap:6px;margin-top:8px"><input id="msg_${id}" placeholder="Reply..."><button class="g" onclick="sendPro('${col}','${id}')">Send</button></div></div>`;loadMessages(col,id);}
async function loadMessages(col,id){let s=await db.collection(col).doc(id).collection('messages').orderBy('timestamp','asc').limit(50).get();let h='';s.forEach(m=>{let d=m.data();h+=`<div style="background:${d.sender=='admin'?'#1e293b':'#0f172a'};padding:8px;border-radius:8px;margin:6px 0"><b>${d.sender}:</b> ${d.text}<br><small>${d.timestamp?new Date(d.timestamp.toDate()).toLocaleString():''}</small></div>`});document.getElementById('msgs_'+id).innerHTML=h||'No messages';}
function sendPro(col,id){let t=document.getElementById('msg_'+id).value.trim();if(!t)return;db.collection(col).doc(id).collection('messages').add({text:t,sender:'admin',timestamp:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{document.getElementById('msg_'+id).value='';loadMessages(col,id);});}
async function loadAllChats(){let html='';try{let snap=await db.collectionGroup('messages').orderBy('timestamp','desc').limit(80).get();let grouped={};snap.forEach(doc=>{let parent=doc.ref.parent.parent;let cid=parent?parent.id:'unknown';let col=parent?parent.parent.id:'clients';if(!grouped[cid])grouped[cid]={col:col,id:cid,msgs:[]};grouped[cid].msgs.push({data:doc.data()});});for(let cid in grouped){let g=grouped[cid];let latest=g.msgs[0]?.data?.text||'';html+=`<div class="glass"><b>👤 ${cid.slice(0,20)}</b><br><small>Last: ${latest.slice(0,60)}</small><div style="display:flex;gap:6px;margin-top:8px"><input id="reply_${cid}" placeholder="Reply..."><button class="g" onclick="quickReply('${g.col}','${cid}')">Send</button></div></div>`;}document.getElementById('allChatsList').innerHTML=html||'<div class=glass>No chats</div>';}catch(e){document.getElementById('allChatsList').innerHTML='<div class=glass>Need index: Firebase Console > Firestore > Indexes > Enable collectionGroup messages order by timestamp DESC<br>'+e.message+'</div>';}}
function quickReply(col,id){let t=document.getElementById('reply_'+id).value.trim();if(!t)return;db.collection(col).doc(id).collection('messages').add({text:t,sender:'admin',timestamp:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{document.getElementById('reply_'+id).value='';loadAllChats();alert('Sent');});}
loadPro();
</script></body></html>
