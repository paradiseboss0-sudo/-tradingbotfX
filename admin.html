<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - TRADINGBOTFS</title><style>body{background:#0b0f26;color:#fff;font-family:Arial;padding:14px}.card{background:#151a3a;padding:12px;margin:8px 0;border-radius:6px}input{padding:6px;background:#0b0f26;border:1px solid #333;color:#fff;border-radius:4px;width:70px}button{padding:6px 10px;border:none;border-radius:4px;cursor:pointer;margin-left:4px}.green{background:#00a651;color:#fff}.red{background:#c0392b;color:#fff}.blue{background:#2e5bff;color:#fff}.login-box{background:#fff;color:#000;max-width:400px;margin:50px auto;padding:20px;border-radius:8px}.login-box input{width:100%;padding:12px;margin:8px 0;background:#fff;color:#000;border:none;border-bottom:1px solid #ddd}.login-btn{width:100%;padding:12px;background:#0a0f2a;color:#fff;border-radius:6px}.chat-msg{background:#0b0f26;padding:10px;margin:6px 0;border-radius:6px;border-left:3px solid #2e5bff}.tab{padding:10px 16px;background:#151a3a;border:none;color:#fff;border-radius:6px 6px 0 0;cursor:pointer;margin-right:4px}.tab.active{background:#2e5bff}</style></head><body><div id="loginBox" class="login-box"><h2 style="text-align:center">ADMIN LOGIN</h2><input id="aEmail" placeholder="Admin Email"><input id="aPass" type="password" placeholder="Password"><button class="login-btn" onclick="adminLogin()">Login as Admin</button><p style="font-size:11px;margin-top:10px;color:#666">Email: Davidjohn70010@gmail.com<br>Pass: Admin@12345</p></div><div id="adminPanel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="color:#f5d06a">↗ ADMIN PANEL</h2><button class="red" onclick="adminLogout()">Logout</button></div><div style="margin:12px 0"><button class="tab active" id="tabClients" onclick="showTab('clients')">Clients (<span id="totalUsers">0</span>)</button><button class="tab" id="tabChats" onclick="showTab('chats')">Live Chat 💬 (<span id="totalChats">0</span>)</button><a href="index.html" style="color:#f5d06a;margin-left:10px;font-size:12px">Go to Client Site</a></div><div id="clientsView"><div id="usersList"></div><button class="red" style="width:100%;margin-top:20px;padding:12px" onclick="clearAll()">Clear All Clients</button></div><div id="chatsView" style="display:none"><div style="background:#151a3a;padding:10px;border-radius:6px;margin-bottom:10px;font-size:12px">Client messages from blue chat button will show here. You can reply.</div><div id="chatsList"></div><button class="blue" style="width:100%;margin-top:10px;padding:10px" onclick="loadChats()">Refresh Messages</button><button class="red" style="width:100%;margin-top:6px;padding:10px" onclick="clearChats()">Clear All Chats</button></div></div><script>function showTab(t){document.getElementById('clientsView').style.display=t=='clients'?'block':'none';document.getElementById('chatsView').style.display=t=='chats'?'block':'none';document.getElementById('tabClients').classList.toggle('active',t=='clients');document.getElementById('tabChats').classList.toggle('active',t=='chats');if(t=='chats')loadChats();}function adminLogin(){let e=document.getElementById('aEmail').value.trim().toLowerCase();let p=document.getElementById('aPass').value.trim();if(e=='davidjohn70010@gmail.com'&&(p.toLowerCase()=='admin@12345'||p=='Admin@12345')){localStorage.setItem('adminLogged','yes');document.getElementById('loginBox').style.display='none';document.getElementById('adminPanel').style.display='block';loadAdmin();loadChats();}else{alert('Invalid admin login')}}function adminLogout(){localStorage.removeItem('adminLogged');location.reload();}function loadAdmin(){let users=JSON.parse(localStorage.getItem('users')||'[]');document.getElementById('totalUsers').innerText=users.length;let list=document.getElementById('usersList');list.innerHTML='';if(users.length==0){list.innerHTML='<p style="background:#151a3a;padding:14px;border-radius:6px">No clients yet</p>';return}users.forEach((u,i)=>{let div=document.createElement('div');div.className='card';div.innerHTML=`<b>${u.full}</b><br><span style="font-size:12px">${u.email} | ${u.mobile||''} | ${u.country||''}</span><br><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">Bal: <input id="b${i}" value="${u.balance||0}"> Cap: <input id="ca${i}" value="${u.capital||0}"> Prof: <input id="p${i}" value="${u.profit||0}"> <select id="pkg${i}" style="width:90px"><option ${u.package=='ordinary'?'selected':''}>ordinary</option><option ${u.package=='starter'?'selected':''}>starter</option><option ${u.package=='standard'?'selected':''}>standard</option><option ${u.package=='premium'?'selected':''}>premium</option></select> <button class="green" onclick="saveUser(${i})">Save</button> <button class="red" onclick="deleteUser(${i})">Del</button></div>`;list.appendChild(div);});}function saveUser(i){let users=JSON.parse(localStorage.getItem('users')||'[]');users[i].balance=parseFloat(document.getElementById('b'+i).value)||0;users[i].capital=parseFloat(document.getElementById('ca'+i).value)||0;users[i].profit=parseFloat(document.getElementById('p'+i).value)||0;users[i].package=document.getElementById('pkg'+i).value;localStorage.setItem('users',JSON.stringify(users));alert('Saved!');}function deleteUser(i){if(confirm('Delete?')){let users=JSON.parse(localStorage.getItem('users')||'[]');users.splice(i,1);localStorage.setItem('users',JSON.stringify(users));loadAdmin();}}function clearAll(){if(confirm('Clear ALL?')){localStorage.removeItem('users');loadAdmin();}}function loadChats(){let chats=JSON.parse(localStorage.getItem('chats')||'[]');document.getElementById('totalChats').innerText=chats.length;let list=document.getElementById('chatsList');list.innerHTML='';if(chats.length==0){list.innerHTML='<p style="background:#151a3a;padding:14px;border-radius:6px">No chat messages yet</p>';return}chats.slice().reverse().forEach((c,i)=>{let realIdx=chats.length-1-i;let div=document.createElement('div');div.className='chat-msg';div.innerHTML=`<div style="display:flex;justify-content:space-between"><b style="color:#f5d06a">${c.name||c.email}</b><span style="font-size:10px;opacity:0.6">${c.time}</span></div><div style="font-size:12px;margin:4px 0">${c.email}</div><div style="background:#151a3a;padding:8px;border-radius:4px;margin:6px 0">${c.message}</div>${c.reply?`<div style="background:#0a4a2a;padding:8px;border-radius:4px;margin:6px 0;border-left:3px solid #00a651"><b>Your Reply:</b><br>${c.reply}</div>`:''}<div style="display:flex;gap:6px;margin-top:8px"><input id="rep${realIdx}" placeholder="Type reply..." style="flex:1;width:auto"><button class="blue" onclick="replyChat(${realIdx})">Reply</button><button class="red" onclick="delChat(${realIdx})">Delete</button></div>`;list.appendChild(div);});}function replyChat(i){let chats=JSON.parse(localStorage.getItem('chats')||'[]');let r=document.getElementById('rep'+i).value;if(!r){alert('Type reply');return}chats[i].reply=r;localStorage.setItem('chats',JSON.stringify(chats));loadChats();alert('Reply saved');}function delChat(i){let chats=JSON.parse(localStorage.getItem('chats')||'[]');chats.splice(i,1);localStorage.setItem('chats',JSON.stringify(chats));loadChats();}function clearChats(){if(confirm('Clear all chats?')){localStorage.removeItem('chats');loadChats();}}(function(){if(localStorage.getItem('adminLogged')=='yes'){document.getElementById('loginBox').style.display='none';document.getElementById('adminPanel').style.display='block';loadAdmin();loadChats();}})();</script></body></html>
