<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - TradingBotFX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e27;color:#fff;padding:10px}
h1{color:#00ff88;margin:20px 0 5px}.card{background:#151a3a;border:1px solid #1e2a5a;border-radius:12px;padding:12px;margin:12px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}th{color:#00ff88;text-align:left;padding:8px;font-size:12px;border-bottom:1px solid #1e2a5a}
td{padding:10px 8px;font-size:12px;border-bottom:1px solid #111633;vertical-align:top}
input{width:90px;background:#0a0e27;border:1px solid #2a3a6a;color:#fff;padding:6px;border-radius:6px}
.btn{background:#00ff88;color:#000;border:none;padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer;margin:2px}
.btn-blue{background:#00c3ff;color:#fff}.btn-red{background:#ff3a2a;color:#fff}
.badge{background:#00ff88;color:#000;padding:2px 8px;border-radius:10px;font-size:11px}
.live{border:1px solid #00ff88;padding:8px;border-radius:8px;margin-top:6px;background:#0a0e27;max-height:120px;overflow-y:auto}
</style></head>
<body>
<h1>Admin Dashboard <span id="count" class="badge">0</span></h1>
<p style="color:#a0a8c0;font-size:13px;margin-bottom:15px">Live clients from Firebase - Edit Capital, Profit, Package + Live Chat + Approve Deposit</p>
<div class="card"><table><thead><tr>
<th>Name</th><th>Contact (Email/Phone)</th><th>Plan</th><th>Capital ($)</th><th>Profit ($)</th><th>Package</th><th>Deposit Status</th><th>LiveChat</th><th>Action</th>
</tr></thead><tbody id="tbody"><tr><td colspan="9">Loading clients from Firebase...</td></tr></tbody></table></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyDummyReplaceWithYours",authDomain:"tradingbotfx.firebaseapp.com",projectId:"tradingbotfx-tdfs",storageBucket:"tradingbotfx.appspot.com",messagingSenderId:"123",appId:"1:123:web:abc"};
// REPLACE ABOVE WITH YOUR REAL FIREBASE CONFIG FROM FIREBASE CONSOLE
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const tbody=document.getElementById('tbody');const countEl=document.getElementById('count');
const q=query(collection(db,"users"),orderBy("createdAt","desc"));
onSnapshot(q,(snap)=>{
  countEl.textContent=snap.size;
  if(snap.empty){tbody.innerHTML="<tr><td colspan=9>No clients yet</td></tr>";return}
  let html="";snap.forEach(d=>{
    const u=d.data();const id=d.id;
    html+=`<tr>
      <td><b>${u.fullName||u.name||'NoName'}</b></td>
      <td>${u.email||''}<br><small style="color:#a0a8c0">${u.phone||u.mobile||''}</small></td>
      <td>${u.plan||'Starter'} - $${u.planAmount||100}</td>
      <td><input id="cap-${id}" value="${u.capital||0}"></td>
      <td><input id="prof-${id}" value="${u.profit||0}"></td>
      <td><input id="pkg-${id}" value="${u.package||'ordinary'}" style="width:80px"></td>
      <td><span style="color:${u.depositStatus=='approved'?'#00ff88':'#ffb400'}">${u.depositStatus||'pending'} ${u.lastDeposit?'<br>$'+u.lastDeposit:''}</span><br><button class="btn btn-blue" onclick="approve('${id}')">Approve</button></td>
      <td><div class="live" id="chat-${id}">${(u.messages||[]).map(m=>`<div><b>${m.from}:</b> ${m.text}</div>`).join('')||'No chat'}</div><input id="reply-${id}" placeholder="Reply..." style="width:110px;margin-top:4px"><button class="btn" onclick="reply('${id}')">Send</button></td>
      <td><button class="btn" onclick="save('${id}')">Save 💾</button><br><button class="btn btn-red" onclick="chat('${id}')">Open Chat</button></td>
    </tr>`});
  tbody.innerHTML=html;
});
window.save=async(id)=>{
  const cap=document.getElementById('cap-'+id).value;const prof=document.getElementById('prof-'+id).value;const pkg=document.getElementById('pkg-'+id).value;
  await updateDoc(doc(db,"users",id),{capital:parseFloat(cap),profit:parseFloat(prof),package:pkg});alert("Saved! Capital $"+cap+" Profit $"+prof+" Updated for client - he will see instantly!");
};
window.approve=async(id)=>{await updateDoc(doc(db,"users",id),{depositStatus:"approved"});alert("Deposit Approved!");};
window.reply=async(id)=>{
  const txt=document.getElementById('reply-'+id).value;if(!txt)return;
  const ref=doc(db,"users",id);
  // simple append - in production use arrayUnion
  alert("Reply sent: "+txt+" (connect your chat collection to save)");
};
</script>
</body></html>
