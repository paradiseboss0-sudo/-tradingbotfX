<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>SUPER ADMIN V4 - ALL CLIENTS</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><style>body{background:#0b1220;color:#fff;padding:10px;font-family:Arial}.card{background:#1e293b;padding:12px;border-radius:10px;margin:8px 0}input,select{width:100%;padding:8px;margin:4px 0;border-radius:6px;background:#0f172a;color:#fff;border:1px solid #555}button{padding:8px 12px;border-radius:6px;border:none;font-weight:bold;margin:3px}.g{background:#00ff88;color:#000}.b{background:#38bdf8;color:#000}</style></head><body><h3 style="color:#00ff88;text-align:center">TRADINGBOTFX V4 - FINDS ALL TODAY & YESTERDAY</h3><div class="card">Found: <b id="cnt">0</b> clients | <span id="st">Loading...</span> <button class=b onclick="loadAll()">Refresh</button></div><div id="list"></div><script>
const cfg={apiKey:"AIzaSyD19gZda8g45mDo3jRDD_ro80xHjS3vIAU",authDomain:"tradingbotfx-8646f.firebaseapp.com",projectId:"tradingbotfx-8646f",storageBucket:"tradingbotfx-8646f.firebasestorage.app",messagingSenderId:"978322458067",appId:"1:978322458067:web:9a90a1b168aa5fa7f49b26"};firebase.initializeApp(cfg);const db=firebase.firestore();
async function loadAll(){let all=[];let html='';document.getElementById('st').innerText='Searching clients & users...';
 for(let col of ['clients','users','traders']){
  try{let snap=await db.collection(col).get();snap.forEach(d=>{all.push({id:d.id,col:col,data:d.data()});});}catch(e){}
 }
 document.getElementById('cnt').innerText=all.length;
 if(all.length==0){document.getElementById('list').innerHTML='<div class=card>❌ No clients in clients OR users collection.<br>Go to Authentication tab to see if today user signed up. If yes, we need to create doc for them.</div>';return;}
 all.forEach(o=>{
  let d=o.data;let cap=d.capital||d.balance||0;let prof=d.profit||0;
  html+=`<div class=card style="border-left:4px solid ${o.col=='clients'?'#00ff88':'#38bdf8'}"><b>${d.email||o.id}</b> <small>(${o.col} | ${d.name||''})</small><br>Capital: <input id="c_${o.id}" value="${cap}" type=number> Profit: <input id="p_${o.id}" value="${prof}" type=number><br><div><button class=g onclick="save('${o.col}','${o.id}')">Save ${o.col}</button> <button class=b onclick="approve('${o.col}','${o.id}')">Approve</button></div></div>`;
 });
 document.getElementById('list').innerHTML=html;document.getElementById('st').innerText='✅ Found '+all.length;
}
function save(col,id){let cap=parseFloat(document.getElementById('c_'+id).value)||0;let prof=parseFloat(document.getElementById('p_'+id).value)||0;db.collection(col).doc(id).update({capital:cap,balance:cap,profit:prof,lastUpdated:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>alert('Saved '+id+' in '+col+' $'+cap)).catch(e=>alert(e.message));}
function approve(col,id){db.collection(col).doc(id).update({status:'active',approved:true}).then(()=>alert('Approved '+id));}
loadAll();
</script></body></html>
