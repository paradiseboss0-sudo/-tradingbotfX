<script>const tfxCfg={apiKey:"AIzaSyD19gZda8g45mDo3jRDD_ro80xHjS3vIAU",authDomain:"tradingbotfx-8646f.firebaseapp.com",projectId:"tradingbotfx-8646f"};if(!firebase.apps.length)firebase.initializeApp(tfxCfg);const tfxDb=firebase.firestore();let loggedUser=localStorage.getItem('tfx_user')||localStorage.getItem('userEmail')||localStorage.getItem('email');let tfxId=loggedUser?loggedUser:(localStorage.getItem('tfx_chat_id')||'guest_'+Date.now());if(!loggedUser&&!localStorage.getItem('tfx_chat_id')){localStorage.setItem('tfx_chat_id',tfxId);}function tfxToggle(){let b=document.getElementById('tfx-box');b.style.display=b.style.display=='flex'?'none':'flex';if(b.style.display=='flex')tfxLoad();}async function tfxLoad(){let s=await tfxDb.collection('clients').doc(tfxId).collection('messages').orderBy('timestamp','asc').limit(100).get();let h='';s.forEach(d=>{let m=d.data();let admin=m.sender=='admin';h+=`<div style="margin:7px 0;display:flex;${admin?'justify-content:flex-start':'justify-content:flex-end'}"><div style="max-width:78%;padding:9px 11px;border-radius:12px;${admin?'background:#1e2a5a;color:#fff':'background:linear-gradient(135deg,#7b61ff,#00d4ff);color:#fff'}">${m.text}</div></div>`});document.getElementById('tfx-msgs').innerHTML=h||'👋 Hi! How can we help?';document.getElementById('tfx-msgs').scrollTop=9999;}async function tfxSend(){let t=document.getElementById('tfx-in').value.trim();if(!t)return;document.getElementById('tfx-in').value='';await tfxDb.collection('clients').doc(tfxId).set({email:tfxId,name:loggedUser||'Live Chat Guest',source:loggedUser?'client-chat':'live-chat',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await tfxDb.collection('clients').doc(tfxId).collection('messages').add({text:t,sender:'user',timestamp:firebase.firestore.FieldValue.serverTimestamp()});tfxLoad();}document.getElementById('tfx-in').addEventListener('keypress',e=>{if(e.key==='Enter')tfxSend();});tfxDb.collection('clients').doc(tfxId).collection('messages').orderBy('timestamp','asc').onSnapshot(()=>{let b=document.getElementById('tfx-box');if(b.style.display=='flex')tfxLoad();});</script>
