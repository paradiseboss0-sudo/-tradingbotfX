<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingBotFX - Client Portal</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD19gZda8g45mDo3jRDD_ro80xHjS3vIAU",
  authDomain: "tradingbotfx-8646f.firebaseapp.com",
  projectId: "tradingbotfx-8646f",
  storageBucket: "tradingbotfx-8646f.firebasestorage.app",
  messagingSenderId: "978322458067",
  appId: "1:978322458067:web:9a90a1b168aa5fa7f49b26",
  measurementId: "G-R607VCHEP2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.registerClient = async function(e){
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  btn.textContent = 'Registering...';
  btn.disabled = true;
  try{
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const plan = document.getElementById('plan').value;
    
    await addDoc(collection(db, "clients"), {
      name, email, phone, plan,
      status: "pending",
      createdAt: serverTimestamp(),
      source: navigator.userAgent
    });
    
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('regForm').reset();
    setTimeout(()=>{document.getElementById('successMsg').style.display='none'},5000);
  }catch(err){
    alert('Error: '+err.message);
    console.error(err);
  }
  btn.textContent = 'Register Now';
  btn.disabled = false;
}
</script>
<style>
body{font-family:Arial,sans-serif;background:#0a0e1a;color:#fff;margin:0;padding:20px}
.container{max-width:450px;margin:40px auto;background:#141a2a;padding:30px;border-radius:12px;border:1px solid #1e2a44}
h1{text-align:center;color:#00d084}
input,select{width:100%;padding:12px;margin:8px 0 16px 0;border-radius:8px;border:1px solid #2a3a5a;background:#0f1525;color:#fff;box-sizing:border-box}
button{width:100%;padding:14px;background:#00d084;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;font-size:16px}
#successMsg{display:none;background:#00d08422;border:1px solid #00d084;color:#00d084;padding:12px;border-radius:8px;margin-top:15px;text-align:center}
</style>
</head>
<body>
<div class="container">
<h1>TradingBotFX</h1>
<p style="text-align:center;color:#8899aa">Register for Automated Trading</p>
<form id="regForm" onsubmit="registerClient(event)">
<input id="name" placeholder="Full Name" required>
<input id="email" type="email" placeholder="Email Address" required>
<input id="phone" placeholder="Phone / Telegram @username" required>
<select id="plan" required>
<option value="">Select Plan</option>
<option value="Starter - $100">Starter - $100</option>
<option value="Pro - $500">Pro - $500</option>
<option value="Elite - $1000">Elite - $1000</option>
</select>
<button id="regBtn" type="submit">Register Now</button>
<div id="successMsg">✅ Registered! We will contact you on Telegram shortly.</div>
</form>
</div>
</body>
</html>
