<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRADINGBOTFS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e1a;color:#fff;min-height:100vh}
.header{background:#111827;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937}
.logo{font-size:22px;font-weight:bold;color:#00ff88;letter-spacing:2px}
.nav a{color:#fff;text-decoration:none;margin-left:15px;padding:8px 15px;border-radius:5px;background:#1f2937}
.chart-box{background:#111827;margin:20px;border-radius:10px;padding:20px;border:1px solid #1f2937}
.chart{height:250px;background:#0a0e1a;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.price-line{position:absolute;width:100%;height:2px;background:#00ff88;top:50%;animation:move 3s infinite}
@keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.buttons{display:flex;gap:15px;margin-top:20px}
.btn{flex:1;padding:15px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.sell{background:#ef4444;color:#fff}
.buy{background:#22c55e;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.stat{background:#1f2937;padding:15px;border-radius:8px;text-align:center}
.login-box{background:#111827;margin:20px;padding:25px;border-radius:10px;border:1px solid #1f2937}
input{width:100%;padding:12px;margin:10px 0;background:#0a0e1a;border:1px solid #374151;border-radius:5px;color:#fff}
.login-btn{width:100%;padding:12px;background:#00ff88;color:#000;border:none;border-radius:5px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<div class="logo">TRADINGBOTFS</div>
<div class="nav"><a href="#" onclick="showLogin()">Login</a><a href="#" onclick="showLogin()">Register</a></div>
</div>

<div class="chart-box">
<h3>BTC/USDT - Live Trading</h3>
<div class="chart" id="chart">
<canvas id="c" width="350" height="250"></canvas>
<div class="price-line"></div>
</div>
<div class="buttons">
<button class="btn sell" onclick="trade('SELL')">SELL ↓</button>
<button class="btn buy" onclick="trade('BUY')">BUY ↑</button>
</div>
<div class="stats">
<div class="stat"><div>Capital</div><div style="color:#00ff88;font-size:20px" id="capital">$1000.00</div></div>
<div class="stat"><div>Profit Today</div><div style="color:#22c55e;font-size:20px" id="profit">+$45.20</div></div>
</div>
</div>

<div class="login-box" id="loginBox">
<h3>Login to TRADINGBOTFS</h3>
<input type="text" id="email" placeholder="Email - Davidjohn70010@gmail.com">
<input type="password" id="pass" placeholder="Password - Admin@12345">
<button class="login-btn" onclick="login()">LOGIN</button>
<p style="margin-top:15px;text-align:center;color:#9ca3af">New user? Capital $1000 auto credited</p>
</div>

<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
let data=[];for(let i=0;i<50;i++)data.push(120+Math.random()*50);
function draw(){ctx.clearRect(0,0,350,250);ctx.beginPath();ctx.strokeStyle='#00ff88';ctx.lineWidth=2;data.forEach((v,i)=>{const x=i*7;const y=250-v*2;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();data.shift();data.push(120+Math.random()*50+Math.sin(Date.now()/1000)*20);requestAnimationFrame(draw)}draw();
function trade(t){alert(t+' Order Placed! Profit +$'+(Math.random()*5).toFixed(2));document.getElementById('profit').innerHTML='+$'+(45+Math.random()*10).toFixed(2)}
function login(){const e=document.getElementById('email').value;const p=document.getElementById('pass').value;if(e==='Davidjohn70010@gmail.com'&&p==='Admin@12345'){alert('Admin Login Success! You can set Capital & Profit for users');}else if(e){alert('User Login Success! Welcome to TRADINGBOTFS - $1000 Capital Added')}else{alert('Enter Email')}}
function showLogin(){document.getElementById('loginBox').scrollIntoView()}
</script>
</body>
</html>
