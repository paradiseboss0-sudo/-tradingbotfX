<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADINGBOTFS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#060a1c;color:#fff;overflow-x:hidden}
.header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;color:#e8c86a;letter-spacing:1px;font-size:18px}
.logo span{color:#ff8a30}
.menu{width:44px;height:38px;background:linear-gradient(135deg,#7b61ff,#2ec4ff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(#1a3a6e 1px,transparent 1px);background-size:50px 50px;opacity:0.15;pointer-events:none}
.network{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0.3;background:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22800%22><circle cx=%2220%22 cy=%2210%22 r=%223%22 fill=%22%232ec4ff%22/><circle cx=%2280%22 cy=%2215%22 r=%223%22 fill=%22%232ec4ff%22/><circle cx=%2250%22 cy=%2230%22 r=%223%22 fill=%22%232ec4ff%22/><line x1=%2220%22 y1=%2210%22 x2=%2250%22 y2=%2230%22 stroke=%22%231a3a6e%22 stroke-width=%221%22/><line x1=%2280%22 y1=%2215%22 x2=%2250%22 y2=%2230%22 stroke=%22%231a3a6e%22 stroke-width=%221%22/></svg>')}
.hero{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:10px 16px 30px;text-align:center}
.chart-wrap{position:relative;width:100%;height:260px;background:#0a0f2a;border-radius:14px;overflow:hidden;border:1px solid #1a2a5a;margin:12px 0}
.chart-img{width:100%;height:100%;object-fit:cover;opacity:0.9}
#tvchart{position:absolute;top:0;left:0;width:100%;height:100%}
.buttons{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:3;width:90%;justify-content:center}
.btn-sell,.btn-buy{padding:12px 26px;border-radius:30px;font-weight:900;font-size:15px;border:none;display:flex;align-items:center;gap:6px;transform:skewX(-12deg);box-shadow:0 6px 20px rgba(0,0,0,0.4);cursor:pointer}
.btn-sell{background:linear-gradient(135deg,#ff6a30,#ff2a2a);color:#fff}
.btn-buy{background:linear-gradient(135deg,#00e676,#00ff88);color:#000}
.btn-sell span,.btn-buy span{transform:skewX(12deg);display:flex;align-items:center;gap:5px}
.icon-circle{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px}
.title{margin-top:22px}
.title small{color:#2ec4ff;font-weight:800;font-size:18px;display:block}
.title h1{font-size:24px;font-weight:900;line-height:1.25;margin:6px 0}
.sub{font-size:14px;font-weight:600;margin:12px 0;line-height:1.4}
.benefit{font-size:14px;color:#d1d5db;margin:18px 0;line-height:1.6}
.benefit b{color:#fff}
.dot{width:6px;height:6px;background:#2ec4ff;border-radius:50%;display:inline-block;margin:0 6px}
.auth-row{display:flex;gap:12px;justify-content:center;margin:22px 0}
.auth-btn{padding:12px 28px;border-radius:25px;font-weight:800;font-size:14px;border:none;cursor:pointer;flex:1;max-width:140px}
.login{background:linear-gradient(135deg,#7b61ff,#2ec4ff);color:#fff}
.register{background:transparent;border:1px solid #7b61ff;color:#fff}
.how{text-align:left;margin-top:30px}
.how h2{font-size:20px}
#loginBox{display:none;max-width:400px;margin:15px auto;background:#101a3a;border:1px solid #1a2a5a;border-radius:12px;padding:18px;text-align:left}
#loginBox input{width:100%;padding:11px;margin:6px 0;background:#060a1c;border:1px solid #1a2a5a;border-radius:8px;color:#fff}
</style>
</head>
